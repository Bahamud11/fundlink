name: Deploy to DirectAdmin via Rsync

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, soap, gd, exif, iconv, pcntl
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Remove unnecessary directories
        run: |
          # Remove all hidden directories except .git
          find . -maxdepth 1 -type d -name ".*" ! -name "." ! -name ".git" -exec rm -rf {} + 2>/dev/null || true
          # Remove large directories
          rm -rf vendor node_modules tests storage/logs bootstrap/cache database/seeders
          # Create empty dirs for storage and bootstrap
          mkdir -p storage/logs bootstrap/cache
          # Remove all markdown files, config files, and lock files
          rm -f *.md .env.example phpunit.xml package-lock.json composer.lock vite.config.js tailwind.config.js
          # Remove any node-related files
          rm -f package.json npm-shrinkwrap.json yarn.lock
          # Remove composer files
          rm -f composer.json
          echo "✓ Cleaned up directories"
          echo "Size before deploy:"
          du -sh . 2>/dev/null || echo "Size: unknown"

      - name: 🔑 Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: 'just-a-placeholder-so-we-dont-get-errors'

      - name: 📦 Install Rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: 🚀 Deploy via Rsync
        run: |
          rsync -avz --delete \
          -e "ssh -o StrictHostKeyChecking=no" \
          --exclude='.git/' \
          --exclude='.github/' \
          --exclude='.agents/' \
          --exclude='.gemini/' \
          --exclude='.claude/' \
          --exclude='.vscode/' \
          --exclude='node_modules/' \
          --exclude='vendor/' \
          --exclude='tests/' \
          --exclude='bootstrap/cache/' \
          --exclude='database/seeders/' \
          --exclude='.env' \
          --exclude='storage/' \
          --exclude='public/storage/' \
          --exclude='public/images/' \
          --exclude='.well-known/' \
          --exclude='database/*.sqlite' \
          ./ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/domains/bahamud.my.id/public_html/

      - name: Deployment completed
        run: echo "✓ Successfully deployed to server via Rsync"
