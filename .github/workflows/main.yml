name: Deploy to DirectAdmin via SCP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, soap, gd, exif, iconv, pcntl
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: 🧹 Clean and Prepare Files for SCP
        run: |
          # 1. Hapus direktori bawaan yang besar dan tidak perlu di server
          rm -rf vendor node_modules tests database/seeders

          # 2. Hapus direktori hidden bawaan editor/AI/Git
          rm -rf .git .github .vscode .gemini .claude .agents
          
          # 3. Hapus file konfigurasi dan source code yang tidak diperlukan di production
          rm -f *.md .env.example phpunit.xml package-lock.json composer.lock vite.config.js tailwind.config.js
          rm -f package.json npm-shrinkwrap.json yarn.lock composer.json

          # 4. Pastikan direktori kosong tersedia untuk framework (tanpa menimpa isi di server)
          # SCP akan membuat folder ini jika belum ada, atau sekadar melewatinya jika sudah ada tanpa menghapus file di dalamnya.
          mkdir -p storage/logs bootstrap/cache
          
          echo "✓ Cleaned up directories"
          echo "Size before deploy:"
          du -sh . 2>/dev/null || echo "Size: unknown"

      - name: 🚀 Deploy via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Kita mengirim semua sisa file/folder di current directory (.)
          source: "."
          # Target disesuaikan dengan path DirectAdmin
          target: "/domains/bahamud.my.id/public_html/"
          # Strip components mengatur level folder; 0 berarti copy isi folder saat ini apa adanya.
          strip_components: 0
          # Opsional: Jika server butuh port SSH custom (default 22, kadang 2222)
          # port: 22 

      - name: Deployment completed
        run: echo "✓ Successfully deployed to server via SCP"
